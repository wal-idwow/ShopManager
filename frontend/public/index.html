<!-- // This is the main HTML file for the MiniShop frontend application. 
        It serves as the entry point for the React application and includes a root div where the React components will be rendered.
        The file also sets up the basic structure of the HTML document, including the character encoding and viewport settings for 
        responsive design. -->


        <!-- The <!DOCTYPE html> declaration defines this document as an HTML5 document. -->      
<!DOCTYPE html>

<!-- The <html> element is the root element of an HTML page. The lang attribute specifies the language of the document. -->
<html lang="en">

<!-- The <head> element contains meta-information about the document, such as character encoding, viewport settings, and the title of the page. -->
<head>
  <!-- The <meta charset="UTF-8"> tag specifies the character encoding for the HTML document, which is UTF-8 in this case. 
       This ensures that the document can display a wide range of characters from different languages. -->
  <meta charset="UTF-8">

  <!-- The <meta name="viewport" content="width=device-width, initial-scale=1.0"> tag sets the viewport to make the website look good on all devices. 
       It sets the width of the viewport to the width of the device and the initial zoom level to 1.0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- The <title> element specifies the title of the HTML document, which is displayed in the browser's title bar or tab. -->
  <title>MiniShop</title>
  
</head>

<!-- The <body> element contains the content of the HTML document. In this case, it includes a div with the id "root"
  which is where the React application will be rendered. -->
<body>
  <div id="root"></div>
</body>
</html>
